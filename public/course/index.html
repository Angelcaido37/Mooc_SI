<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071329"><title>Misión NEXUS 18 · Acceso</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="login.css"><link rel="stylesheet" href="accessibility.css?v=18"></head><body class="login-page"><a class="skip-link" href="#loginMain">Saltar al acceso</a><main id="loginMain" class="login-shell"><section class="login-hero"><span class="eyebrow">NEXUS 18 · SISTEMAS INTELIGENTES</span><h1>Misión NEXUS</h1><p>Aprender, experimentar, colaborar, demostrar y mejorar.</p><div class="login-metrics"><span>26 sesiones</span><span>Gamificación con propósito</span><span>Evaluación + analítica</span></div></section><section class="login-panel"><span class="brand-mark">N</span><h2>Acceso al curso</h2><p>Esta edición funciona con FastAPI + SQLite y no requiere Firebase, Google Cloud ni Classroom.</p><form id="loginForm" class="eval-form"><label>Perfil<select name="role"><option value="student">Estudiante</option><option value="teacher">Docente</option></select></label><label>Nombre<input name="name" required placeholder="Nombre"></label><label>Correo o identificador<input name="email" type="email" required placeholder="nombre@universidad.mx"></label><label id="courseCodeRow">Código del curso<input name="courseCode" value="NEXUS18"></label><label id="accessKeyRow">Clave individual <span class="small">(si fue asignada)</span><input name="accessKey" type="password" autocomplete="one-time-code" placeholder="Clave personal del curso"></label><label id="passwordRow" hidden>Contraseña docente<input name="password" type="password" autocomplete="current-password"></label><label class="privacy-consent"><input name="privacyAccepted" type="checkbox" required> He leído el <a href="privacy.html" target="_blank" rel="noopener">aviso de privacidad y tratamiento de datos</a> aplicable a este piloto.</label><button class="btn btn-primary login-btn" type="submit">Entrar a NEXUS</button><p id="loginStatus" class="small" role="status"></p></form></section></main><script src="runtime-config.js?v=18"></script><script src="platform-local.js?v=18"></script><script>const f=document.querySelector('#loginForm'),role=f.elements.role,code=document.querySelector('#courseCodeRow'),accessKey=document.querySelector('#accessKeyRow'),pwd=document.querySelector('#passwordRow'),status=document.querySelector('#loginStatus');role.onchange=()=>{const t=role.value==='teacher';code.hidden=t;accessKey.hidden=t;pwd.hidden=!t};window.addEventListener('nexus-auth-change',e=>{if(e.detail.user)location.replace(e.detail.role==='teacher'?'docente.html':'estudiante.html')});f.onsubmit=async e=>{e.preventDefault();status.textContent='Verificando…';try{const d=Object.fromEntries(new FormData(f));await NEXUS_AUTH.signIn(d)}catch(err){status.textContent=err.message}};</script><script src="accessibility.js?v=18"></script></body></html>
