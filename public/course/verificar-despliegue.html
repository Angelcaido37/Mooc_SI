<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificar despliegue NEXUS 19</title><link rel="stylesheet" href="styles.css"></head><body><main class="main" style="max-width:900px;margin:auto;padding:30px"><h1>Verificación de despliegue · NEXUS 19 FINAL R2</h1><div id="result"><p>Verificando…</p></div></main><script src="runtime-config.js"></script><script>async function run(){const r=document.getElementById('result');const rows=[];rows.push(['Frontend','FINAL R2',true]);rows.push(['Módulo comunicación',location.origin+location.pathname.replace(/verificar-despliegue\.html$/,'communication.js'),true]);try{const m=await fetch('release.json',{cache:'no-store'}).then(x=>x.json());rows.push(['release.json',m.release,m.release==='FINAL R2'])}catch(e){rows.push(['release.json','No disponible',false])}try{const base=(window.NEXUS_CONFIG&&window.NEXUS_CONFIG.apiBase)||'';const h=await fetch(base.replace(/\/api$/,'')+'/health',{cache:'no-store'}).then(x=>x.json());rows.push(['Backend release',h.release||'sin dato',h.release==='19-final-r2']);rows.push(['Almacenamiento',h.storage||'sin dato',!!h.persistent]);rows.push(['Producción',h.productionReady?'Lista':'Pendiente',!!h.productionReady])}catch(e){rows.push(['Backend','No accesible',false])}r.innerHTML=rows.map(x=>`<article class="content-block"><strong>${x[2]?'✓':'!'}</strong> ${x[0]}: <b>${x[1]}</b></article>`).join('')}run()</script></body></html>
