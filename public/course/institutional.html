<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gobernanza institucional · NEXUS 19</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="accessibility.css?v=18"></head><body><a class="skip-link" href="#main">Saltar al contenido</a><main id="main" class="main" style="max-width:1050px;margin:auto"><header class="page-head"><span class="eyebrow">NEXUS 19 · GOBERNANZA</span><h1>Centro institucional</h1><p>Respaldos, exportación para validación, solicitudes de datos y bitácora de auditoría.</p></header><section class="content-block"><div class="button-row"><button id="backupBtn" class="btn btn-primary">Crear respaldo ahora</button><button id="researchBtn" class="btn btn-dark">Preparar exportación de validación</button><a class="btn btn-outline" href="docente.html">Volver al panel docente</a></div><p id="actionStatus" role="status"></p></section><section class="content-block"><h2>Respaldos</h2><div id="backups">Cargando…</div></section><section class="content-block"><h2>Solicitudes de estudiantes</h2><div id="requests">Cargando…</div></section><section class="content-block"><h2>Bitácora de auditoría</h2><div id="audit">Cargando…</div></section></main><script src="runtime-config.js?v=18"></script><script src="platform-local.js?v=18"></script><script src="accessibility.js?v=18"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
(async()=>{await NEXUS_AUTH.init();if(!NEXUS_AUTH.user||NEXUS_AUTH.role!=='teacher'){location.replace('index.html');return;}const api=NEXUS_AUTH.api,status=document.querySelector('#actionStatus');async function load(){const [b,r,a]=await Promise.all([api('/teacher/backups'),api('/teacher/data-requests'),api('/teacher/audit-log')]);document.querySelector('#backups').innerHTML=b.length?b.map(x=>`<p><strong>${esc(x.file)}</strong> · ${(x.bytes/1024).toFixed(1)} KB · SHA-256 ${esc(x.sha256.slice(0,16))}…</p>`).join(''):'<p>Sin respaldos todavía.</p>';document.querySelector('#requests').innerHTML=r.length?r.map(x=>`<p><strong>${esc(x.kind)}</strong> · ${esc(x.name)} · ${esc(x.status)}<br><small>${esc(x.detail)}</small></p>`).join(''):'<p>Sin solicitudes.</p>';document.querySelector('#audit').innerHTML=a.length?a.slice(0,100).map(x=>`<p><strong>${esc(x.action)}</strong> · ${esc(x.actor_role)} · ${new Date(x.created_at).toLocaleString('es-MX')}</p>`).join(''):'<p>Sin eventos.</p>';}document.querySelector('#backupBtn').onclick=async()=>{try{const b=await api('/teacher/backup',{method:'POST'});status.textContent='Respaldo creado: '+b.file+' · '+b.sha256;await load()}catch(e){status.textContent=e.message}};document.querySelector('#researchBtn').onclick=async()=>{try{const d=await api('/teacher/research-export');const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nexus19-validacion-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);status.textContent='Exportación preparada.'}catch(e){status.textContent=e.message}};await load()})();
</script></body></html>
